name: Build and Deploy Flutter Web to Cloudflare Pages

on:
  push:
    branches:
      - main

jobs:
  build_and_deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.29.0'

      - name: Install dependencies
        run: flutter pub get

      - name: Build Flutter Web
        run: flutter build web --release
      - name: Install Wrangler CLI
        run: npm install -g wrangler

      - name: Deploy to Cloudflare Pages
        run: |
          wrangler pages deploy ./build/web \
            --project-name ${{ secrets.CLOUDFLARE_PAGES_PROJECT }} \
            --branch main
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          
      - name: Notify success
        if: success()
        run: |
          curl -X POST -H "Content-Type: application/json" \
          -d '{"content": "✅ Deploy do Flutter Web para o Cloudflare Pages finalizado com sucesso!"}' \
          ${{ secrets.DISCORD_WEBHOOK_URL }}

      - name: Notify failure
        if: failure()
        run: |
          curl -X POST -H "Content-Type: application/json" \
          -d '{"content": "❌ O deploy do Flutter Web falhou. Verifique os logs no GitHub Actions!"}' \
          ${{ secrets.DISCORD_WEBHOOK_URL }}
